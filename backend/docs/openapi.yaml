openapi: 3.0.3
info:
  title: Room-Bot Service API Documentation
  description: Comprehensive OpenAPI 3.0 specification for the Room-Bot Hostel Service Management System backend APIs.
  version: 1.0.0
servers:
  - url: http://localhost:5000/api/v1
    description: Local Development Server
paths:
  # Authentication Endpoints
  /auth/register/student:
    post:
      summary: Register a new Student
      description: Creates a student account in unverified status and logs/emails a 6-digit OTP verification code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentRegisterInput'
      responses:
        '201':
          description: Student registered successfully (OTP dispatched).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseStudent'
        '400':
          description: Invalid inputs or specified Block does not exist.
        '409':
          description: Email or Registration Number already registered.

  /auth/register/staff:
    post:
      summary: Register a new Staff member
      description: Creates a staff account in unverified status and logs/emails a 6-digit OTP verification code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffRegisterInput'
      responses:
        '201':
          description: Staff registered successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseStaff'
        '400':
          description: Invalid inputs or specified Block does not exist.
        '409':
          description: Email or Employee ID already registered.

  /auth/verify-otp:
    post:
      summary: Verify account registration OTP
      description: Activates a student or staff account by verifying the 6-digit OTP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpInput'
      responses:
        '200':
          description: Account verified successfully.
        '400':
          description: Invalid or expired OTP.

  /auth/login:
    post:
      summary: User Login
      description: Authenticates Student, Staff, or Admin, returns session token, and sets secure HTTP-only cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Login successful. Sets 'token' cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseLogin'
        '401':
          description: Invalid credentials or unverified email.
        '403':
          description: Account blocked or inactive.

  /auth/forgot-password:
    post:
      summary: Forgot Password Request
      description: Triggers a password recovery OTP code dispatch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordInput'
      responses:
        '200':
          description: Password recovery OTP sent.
        '404':
          description: Registered email not found.

  /auth/reset-password:
    post:
      summary: Reset Password with OTP
      description: Resets user password using the dispatched recovery OTP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordInput'
      responses:
        '200':
          description: Password reset successfully.
        '400':
          description: Invalid or expired OTP.

  /auth/logout:
    post:
      summary: User Logout
      description: Clears HTTP-only JWT cookie.
      responses:
        '200':
          description: Logged out successfully.

  # Student Workflow Endpoints
  /students/requests:
    post:
      summary: Create a new service request
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequestInput'
      responses:
        '201':
          description: Service request created and dynamically matched.
        '400':
          description: Invalid input fields.
        '401':
          description: Unauthenticated.
        '403':
          description: Unauthorized role (Non-STUDENT).

    get:
      summary: Get student request history
      security:
        - CookieAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: priority
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Paginated request history.

  /students/complaints:
    post:
      summary: Submit a new complaint
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComplaintInput'
      responses:
        '201':
          description: Complaint submitted successfully.

    get:
      summary: Get student complaints history
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Complaints history.

  /students/requests/{id}/feedback:
    post:
      summary: Submit feedback for completed request
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitFeedbackInput'
      responses:
        '201':
          description: Feedback submitted successfully.
        '400':
          description: Request not completed.
        '403':
          description: Ownership violation.
        '409':
          description: Feedback already submitted.

  # Staff Workflow Endpoints
  /staff/dashboard:
    get:
      summary: Get staff dashboard stats
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Dashboard stats compiled successfully.

  /staff/requests:
    get:
      summary: Get assigned requests
      security:
        - CookieAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Paginated assigned requests.

  /staff/requests/{id}/start:
    patch:
      summary: Start work on request
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Request status set to IN_PROGRESS.
        '409':
          description: Invalid transition (Must be ASSIGNED).

  /staff/requests/{id}/request-completion:
    post:
      summary: Request completion and send OTP
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Request status set to OTP_PENDING, OTP generated and sent to student.
        '409':
          description: Invalid transition (Must be IN_PROGRESS).

  /staff/requests/{id}/verify-completion:
    post:
      summary: Verify completion OTP
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - otp
              properties:
                otp:
                  type: string
                  pattern: '^\d{6}$'
      responses:
        '200':
          description: OTP verified and request set to COMPLETED.
        '400':
          description: Invalid or expired OTP.
        '409':
          description: Invalid transition (Must be OTP_PENDING).

  /staff/profile:
    get:
      summary: Get staff profile details
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Staff profile with average rating.

  # Admin Endpoints
  /admin/dashboard:
    get:
      summary: Get admin dashboard stats and analytics
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Dashboard stats successfully compiled.

  /admin/students:
    get:
      summary: Get list of students
      security:
        - CookieAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: status
          in: query
          schema:
            type: string
            enum: [verified, unverified, blocked]
        - name: blockId
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated student list.

  /admin/students/{id}/block:
    patch:
      summary: Block or unblock student
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - isBlocked
              properties:
                isBlocked:
                  type: boolean
      responses:
        '200':
          description: Student blocked/unblocked successfully.

  /admin/staff:
    get:
      summary: Get list of staff members
      security:
        - CookieAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive, unverified]
        - name: role
          in: query
          schema:
            type: string
        - name: blockId
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated staff list.

  /admin/staff/{id}/status:
    patch:
      summary: Activate or deactivate staff member
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - isActive
              properties:
                isActive:
                  type: boolean
      responses:
        '200':
          description: Staff active status updated.

  /admin/blocks:
    get:
      summary: Get hostel blocks list
      security:
        - CookieAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Paginated block list.
    post:
      summary: Create new hostel block
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Block created successfully.
        '409':
          description: Duplicate block name.

  /admin/blocks/{id}:
    delete:
      summary: Delete hostel block (constraint guarded)
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Block deleted successfully.
        '400':
          description: Deletion rejected because students or staff are registered to it.

  /admin/service-types:
    get:
      summary: Get service types list
      security:
        - CookieAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Service types.
    post:
      summary: Create new service type
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - description
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Service type category created.
        '409':
          description: Duplicate service type name.

  /admin/service-types/{id}/toggle:
    patch:
      summary: Toggle service type active status (Soft delete)
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - isActive
              properties:
                isActive:
                  type: boolean
      responses:
        '200':
          description: Service type active status toggled.

  /admin/requests:
    get:
      summary: Get all service requests
      security:
        - CookieAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: status
          in: query
          schema:
            type: string
        - name: serviceTypeId
          in: query
          schema:
            type: string
        - name: staffId
          in: query
          schema:
            type: string
        - name: blockId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated request list.

  /admin/requests/{id}/reassign:
    patch:
      summary: Reassign request to specific staff member
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - staffId
              properties:
                staffId:
                  type: string
      responses:
        '200':
          description: Request successfully reassigned, status reset to ASSIGNED.
        '400':
          description: Invalid staff role, block mismatch, or inactive/unverified staff.

  /admin/complaints:
    get:
      summary: Get student complaints
      security:
        - CookieAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated complaints.

  /admin/complaints/{id}/resolve:
    patch:
      summary: Resolve student complaint
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Complaint status resolved.

  /admin/feedbacks:
    get:
      summary: Get student feedback lists
      security:
        - CookieAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: rating
          in: query
          schema:
            type: integer
        - name: staffId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Feedback reviews.

components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: token
  schemas:
    StudentRegisterInput:
      type: object
      required:
        - registrationNo
        - name
        - email
        - password
        - roomNumber
        - gender
        - blockId
      properties:
        registrationNo:
          type: string
        name:
          type: string
        email:
          type: string
        password:
          type: string
        roomNumber:
          type: string
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
        blockId:
          type: string
    StaffRegisterInput:
      type: object
      required:
        - employeeId
        - name
        - email
        - password
        - role
        - blockId
      properties:
        employeeId:
          type: string
        name:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [CLEANING, ELECTRICIAN, PLUMBER, CARPENTER, GENERAL]
        blockId:
          type: string
    VerifyOtpInput:
      type: object
      required:
        - email
        - otp
      properties:
        email:
          type: string
        otp:
          type: string
    LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string
    ForgotPasswordInput:
      type: object
      required:
        - email
      properties:
        email:
          type: string
    ResetPasswordInput:
      type: object
      required:
        - email
        - otp
        - newPassword
      properties:
        email:
          type: string
        otp:
          type: string
        newPassword:
          type: string
    CreateRequestInput:
      type: object
      required:
        - title
        - description
        - serviceTypeId
      properties:
        title:
          type: string
        description:
          type: string
        serviceTypeId:
          type: string
        priority:
          type: integer
    CreateComplaintInput:
      type: object
      required:
        - subject
        - description
      properties:
        subject:
          type: string
        description:
          type: string
    SubmitFeedbackInput:
      type: object
      required:
        - rating
      properties:
        rating:
          type: integer
        comment:
          type: string
    ApiResponseStudent:
      type: object
      properties:
        success:
          type: boolean
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
    ApiResponseStaff:
      type: object
      properties:
        success:
          type: boolean
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
    ApiResponseLogin:
      type: object
      properties:
        success:
          type: boolean
        statusCode:
          type: integer
        message:
          type: string
        data:
          type: object
